name: Build & Deploy (GHCR → VPS)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: echo "version=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute frontend VITE_API_BASE_URL
        id: frontend_api
        shell: bash
        env:
          PROD_VITE_API_BASE_URL: ${{ secrets.PROD_VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${PROD_VITE_API_BASE_URL:-}" ]; then
            echo "api_base=${PROD_VITE_API_BASE_URL}" >> "$GITHUB_OUTPUT"
          else
            echo "api_base=http://localhost:8000" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/music-marketplace-backend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/music-marketplace-backend:latest
          provenance: false

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ steps.frontend_api.outputs.api_base }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/music-marketplace-frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/music-marketplace-frontend:latest
          provenance: false

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      GHCR_USERNAME: ${{ github.repository_owner }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
    steps:
      - name: Validate deploy secrets (fail fast)
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          need() {
            local name="$1"
            local val="$2"
            if [ -z "${val}" ]; then
              echo "Missing secret: ${name}"
              missing=1
            fi
          }

          need HOST "${{ secrets.HOST }}"
          need USER "${{ secrets.USER }}"
          need SSH_KEY "${{ secrets.SSH_KEY }}"
          need APP_DIR "${{ secrets.APP_DIR }}"
          need GHCR_PULL_TOKEN "${GHCR_PULL_TOKEN}"

          PORT_VAL="${{ secrets.PORT }}"
          if [ -z "${PORT_VAL}" ]; then
            echo "Missing secret PORT — set it to your SSH port (usually 22)."
            missing=1
          fi

          if [ "${missing}" != "0" ]; then
            exit 1
          fi

      - name: Deploy via SSH (pull images + compose up)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          envs: GHCR_USERNAME,GHCR_PULL_TOKEN
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.APP_DIR }}"
            cd "${APP_DIR}"

            # Optional server-side env file (recommended)
            if [ -f ./.env.production ]; then
              set -a
              . ./.env.production
              set +a
            fi

            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            export GITHUB_OWNER="${{ github.repository_owner }}"

            # Authenticate Docker on the VPS to pull private GHCR packages.
            echo "${GHCR_PULL_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            docker compose -p musicmarketplace -f docker-compose.prod.yml pull
            docker compose -p musicmarketplace -f docker-compose.prod.yml up -d
            docker image prune -f
            docker compose -p musicmarketplace -f docker-compose.prod.yml ps

