name: Deploy (VPS)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    # Optional safety: require manual approval via GitHub Environment protection rules on `production`.

    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"

            # Expect the VPS to have git + docker compose installed, and this repo checked out once.
            git fetch --prune
            git checkout "${{ github.ref_name }}"
            git pull --ff-only

            # Load production env vars from a server-side file you maintain (recommended).
            # Example server file contents:
            #   export JWT_SECRET=...
            #   export POSTGRES_PASSWORD=...
            #   export VITE_API_BASE_URL=https://api.example.com
            if [ -f ./.env.production ]; then
              set -a
              . ./.env.production
              set +a
            fi

            docker compose pull || true
            docker compose up -d --build
