name: Deploy (VPS) — git pull + compose build

# Manual-only to avoid conflicting with GHCR deploy on every push.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_DIR }}"

            git fetch --prune
            git checkout "${{ github.ref_name }}"
            git pull --ff-only

            if [ -f ./.env.production ]; then
              set -a
              . ./.env.production
              set +a
            fi

            docker compose pull || true
            docker compose up -d --build
